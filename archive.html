<body id="stars-bg">
     <div id="root"></div>
    <script

      type="text/babel"
      data-presets="react"
      data-type="module"
    >
      import { Navbar } from './index.jsx';
      ReactDOM.createRoot(document.getElementById('root')).render(

      );

<div class="title">
        <img src="logo.png" alt="KYUplink Logo" class="logo">
    <h1>ARCHIVE</h1>
</div>

<section>
  <button class="date" onclick="toggleDate('embed-1')">09/04/2026</button>
  <div id="embed-1" class="spotify-embed">
    <div class="player">
    <iframe data-testid="embed-iframe" style="border-radius:12px" src="https://drive.google.com/file/d/1zPc5STVRie0Wo2yTG5891obAWhMlqXz3/preview" width="100%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
  </div>
  </div>


  <button class="date" onclick="toggleDate('embed-2')">04/08/2026</button>
  <div id="embed-2" class="spotify-embed">
     <div class="player">
    <iframe data-testid="embed-iframe" style="border-radius:12px" src="https://drive.google.com/file/d/1TZnlMmAICl4KwsXOXfWzANsxqqB8pd45/preview" width="100%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
  </div>
  </div>
</section>
    
<script>
function toggleDate(targetId) {
  const targetEmbed = document.getElementById(targetId);
  
  if (!targetEmbed) return; 

  const isAlreadyOpen = targetEmbed.classList.contains('open');

  document.querySelectorAll('.spotify-embed').forEach(embed => {
    embed.classList.remove('open');
  });
 
  if (!isAlreadyOpen) {
    targetEmbed.classList.add('open');
  }
}

</script>
