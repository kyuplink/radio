<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Schedule</title>

      type="text/babel"
      src="index.jsx"
    ></script>

<body id="stars-bg">
     <div id="root"></div>
    <script
      data-plugins="transform-modules-umd"
      type="text/babel"
      data-presets="react"
      data-type="module"
    >
      import { Navbar } from './index.jsx';
      ReactDOM.createRoot(document.getElementById('root')).render(
        <Navbar />
      );
    </script>

<div class="title">
        <img src="logo.png" alt="KYUplink Logo" class="logo">
    <h1>INTERACT</h1>
</div>

<div class="interact-box">
        
<form id="interact-form">
  <div class="tabs">
    <button type="button" class="tab tab-confessions active" data-tab="confessions">Confessions</button>
    <button type="button"class="tab tab-song" data-tab="song">Song suggestion</button>
    <button type="button" class="tab tab-feedback" data-tab="feedback">Feedback</button>
  </div>

       
 <div class="content-panel">       
            
  <div id="confessions-panel" class="tab-content active-content">
    <div class="input-group">
      <label>Spill the tea</label>
      <input type="text" name="confession_text" placeholder="But, please keep it clean">
    </div>

    <div class="input-group">
      <label>How should we address you ?</label>
      <input type="text" name="confession_author" placeholder="Or keep it anonymous, no one rlly cares tbh">
    </div>
  </div>

            
  <div id="song-panel" class="tab-content">
    <div class="input-group">
      <label>What track is on repeat?</label>
      <input type="text" name="song_track" placeholder="Artist - Song Name">
    </div>
    <div class="input-group">
      <label>Who is this for?</label>
      <input type="text" name="song_recipient" placeholder="Leave blank if it's for the vibe">
    </div>
  </div>

            
  <div id="feedback-panel" class="tab-content">
    <div class="input-group">
      <label>What can we improve?</label>
      <input type="text" name="feedback_text" placeholder="Drop your honest thoughts here...">
    </div>
  </div>

  </div>

  <div class="submit-wrapper">
    <button type="submit" class="submit-button">Submit</button>
  </div>
</form>
</div>

    <script src="interact.js"></script>
    
</body>
</html>


</div>
</body>
